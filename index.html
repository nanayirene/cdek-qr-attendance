<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CdeK Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-top: 12px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startButton {
      background: #1a73e8;
      color: white;
    }

    #stopButton {
      background: #777;
      color: white;
      display: none;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f3f4;
      min-height: 30px;
    }

    .success {
      background: #d9f7df !important;
      color: #176b2c;
    }

    .error {
      background: #fde0e0 !important;
      color: #a00000;
    }

    .info {
      background: #e3f2fd !important;
      color: #155a8a;
    }

    .student-name {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }

    .action {
      font-size: 18px;
      font-weight: bold;
    }

    #loginScreen {
      display: block;
    }

    #scannerApp {
      display: none;
    }

    #loginButton {
      background: #1a73e8;
      color: white;
      width: 100%;
    }

    #logoutButton {
      background: #777;
      color: white;
      float: right;
      margin-top: 0;
    }

    .clear {
      clear: both;
    }

    .login-note {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginScreen">

    <h1>CdeK Attendance Scanner</h1>
    <div class="subtitle">Authorized Scanner Access</div>

    <label for="scannerPassword">Scanner Password</label>
    <input
      type="password"
      id="scannerPassword"
      placeholder="Enter scanner password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="loginScanner()">
      🔐 Unlock Scanner
    </button>

    <div id="loginResult" class="info">
      Please enter the scanner password.
    </div>

    <div class="login-note">
      This scanner is restricted to authorized staff.
    </div>

  </div>

  <div id="scannerApp">

    <button id="logoutButton" onclick="logoutScanner()">
      Log Out
    </button>
    <div class="clear"></div>

    <h1>CdeK Attendance Scanner</h1>
    <div class="subtitle">QR Attendance Monitoring System</div>

    <label for="scannerName">Scanner Name</label>
    <input
      type="text"
      id="scannerName"
      placeholder="Enter scanner name"
    >

    <label for="activity">Activity</label>
    <select id="activity">
      <option value="">Loading activities...</option>
    </select>

    <button id="startButton" onclick="startScanner()">
      Start Scanner
    </button>

    <button id="stopButton" onclick="stopScanner()">
      Stop Scanner
    </button>

    <div id="reader"></div>

    <div id="result" class="info">
      Ready.
    </div>

  </div>

</div>

<script>

  // =========================================================
  // GOOGLE APPS SCRIPT WEB APP
  // =========================================================

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbzoWNfOgXN-BoUEvotDPlMvyMO7_HBnnPKVcVAJnEHlS7YkSisKxkcgENkamWO0USwjhA/exec";


  // =========================================================
  // VARIABLES
  // =========================================================

  let html5QrCode = null;
  let scannerRunning = false;
  let processingScan = false;
  let scannerToken = null;
  let loginInProgress = false;


  // =========================================================
  // PAGE LOAD
  // =========================================================

  window.onload = function () {

    const savedScannerName =
      localStorage.getItem("cdekScannerName");

    if (savedScannerName) {
      document.getElementById("scannerName").value =
        savedScannerName;
    }

    document
      .getElementById("scannerPassword")
      .focus();
  };



  // =========================================================
  // SCANNER LOGIN
  // =========================================================

  function loginScanner() {

    if (loginInProgress) {
      return;
    }

    const password =
      document.getElementById("scannerPassword")
        .value;

    if (!password) {
      showLoginResult(
        "Please enter the scanner password.",
        "error"
      );
      return;
    }

    loginInProgress = true;

    showLoginResult(
      "Checking password...",
      "info"
    );

    const callbackName =
      "loginCallback_" + Date.now();

    window[callbackName] =
      function(response) {

        try {

          if (
            response &&
            response.success &&
            response.token
          ) {

            scannerToken =
              response.token;

            document
              .getElementById("loginScreen")
              .style.display = "none";

            document
              .getElementById("scannerApp")
              .style.display = "block";

            document
              .getElementById("scannerPassword")
              .value = "";

            showResult(
              "Access granted. Loading active activities...",
              "info"
            );

            loadActivities();

          } else {

            showLoginResult(
              response && response.message
                ? response.message
                : "Unable to unlock scanner.",
              "error"
            );

          }

        } catch (error) {

          console.error(error);

          showLoginResult(
            "Unable to unlock scanner.",
            "error"
          );

        } finally {

          delete window[callbackName];

          const script =
            document.getElementById(callbackName);

          if (script) {
            script.remove();
          }

          loginInProgress = false;
        }
      };

    const script =
      document.createElement("script");

    script.id = callbackName;

    script.src =
      WEB_APP_URL +
      "?action=login" +
      "&password=" +
      encodeURIComponent(password) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();

    script.onerror = function() {

      showLoginResult(
        "Could not connect to the attendance server.",
        "error"
      );

      delete window[callbackName];
      script.remove();

      loginInProgress = false;
    };

    document.body.appendChild(script);
  }


  function showLoginResult(message, type) {

    const result =
      document.getElementById("loginResult");

    result.className = type;
    result.textContent = message;
  }


  function logoutScanner() {

    if (scannerRunning) {
      stopScanner();
    }

    scannerToken = null;

    document
      .getElementById("scannerApp")
      .style.display = "none";

    document
      .getElementById("loginScreen")
      .style.display = "block";

    document
      .getElementById("scannerPassword")
      .value = "";

    showLoginResult(
      "Logged out. Please enter the scanner password.",
      "info"
    );

    setTimeout(function() {
      document
        .getElementById("scannerPassword")
        .focus();
    }, 100);
  }


  // =========================================================
  // LOAD ACTIVE ACTIVITIES
  // =========================================================

  function loadActivities() {

    showResult(
      "Loading active activities...",
      "info"
    );

    const callbackName =
      "activityCallback_" + Date.now();

    window[callbackName] = function(response) {

      try {

        if (!response || !response.success) {

          if (
            response &&
            response.message === "Scanner login required."
          ) {
            logoutScanner();
            return;
          }

          showResult(
            response && response.message
              ? response.message
              : "Unable to load activities.",
            "error"
          );

          return;
        }

        const select =
          document.getElementById("activity");

        select.innerHTML = "";

        if (!response.activities ||
            response.activities.length === 0) {

          const option =
            document.createElement("option");

          option.value = "";
          option.textContent =
            "No active activities";

          select.appendChild(option);

          showResult(
            "No active activities found.",
            "error"
          );

          return;
        }

        response.activities.forEach(function(activity) {

          const option =
            document.createElement("option");

          option.value = activity.activityID;

          option.textContent =
            activity.activityID +
            " - " +
            activity.activityName;

          select.appendChild(option);

        });

        showResult(
          "Activity loaded. Ready to scan.",
          "success"
        );

      } catch (error) {

        showResult(
          "Error loading activities.",
          "error"
        );

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

      }
    };


    const script =
      document.createElement("script");

    script.id = callbackName;

    script.src =
      WEB_APP_URL +
      "?action=activities" +
      "&token=" +
      encodeURIComponent(scannerToken || "") +
      "&callback=" +
      callbackName +
      "&_=" +
      Date.now();

    script.onerror = function() {

      showResult(
        "Could not connect to the attendance server.",
        "error"
      );

      delete window[callbackName];
      script.remove();

    };

    document.body.appendChild(script);
  }


  // =========================================================
  // START SCANNER
  // =========================================================

  function startScanner() {

    if (scannerRunning) {
      return;
    }

    const scannerName =
      document.getElementById("scannerName")
        .value
        .trim();

    const activityID =
      document.getElementById("activity")
        .value;

    if (!scannerName) {

      showResult(
        "Please enter the scanner name first.",
        "error"
      );

      document.getElementById("scannerName").focus();

      return;
    }

    if (!activityID) {

      showResult(
        "Please select an activity.",
        "error"
      );

      return;
    }

    localStorage.setItem(
      "cdekScannerName",
      scannerName
    );

    processingScan = false;

    html5QrCode =
      new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    };

    html5QrCode
      .start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      )
      .then(function() {

        scannerRunning = true;

        document.getElementById(
          "startButton"
        ).style.display = "none";

        document.getElementById(
          "stopButton"
        ).style.display = "inline-block";

        showResult(
          "Scanner is active. Scan a student's QR code.",
          "info"
        );

      })
      .catch(function(error) {

        console.error(error);

        showResult(
          "Camera could not start. Please allow camera access and try again.",
          "error"
        );

        html5QrCode = null;
      });
  }


  // =========================================================
  // STOP SCANNER
  // =========================================================

  function stopScanner() {

    if (!html5QrCode || !scannerRunning) {
      return;
    }

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

        document.getElementById(
          "startButton"
        ).style.display = "inline-block";

        document.getElementById(
          "stopButton"
        ).style.display = "none";

        showResult(
          "Scanner stopped.",
          "info"
        );

      })
      .catch(function(error) {

        console.error(error);

      });
  }


  // =========================================================
  // QR SCAN SUCCESS
  // =========================================================

  function onScanSuccess(decodedText) {

    if (processingScan) {
      return;
    }

    processingScan = true;

    console.log(
      "QR scanned:",
      decodedText
    );

    const qrID =
      decodedText.trim();

    const scannerName =
      document.getElementById("scannerName")
        .value
        .trim();

    const activityID =
      document.getElementById("activity")
        .value;

    if (!qrID) {

      processingScan = false;

      return;
    }

    showResult(
      "Checking attendance...",
      "info"
    );

    sendAttendance(
      qrID,
      activityID,
      scannerName
    );
  }


  // =========================================================
  // QR SCAN FAILURE
  // =========================================================

  function onScanFailure(error) {
    // Normal behavior while looking for a QR code.
  }


  // =========================================================
  // SEND ATTENDANCE
  // =========================================================

  function sendAttendance(
    qrID,
    activityID,
    scannerName
  ) {

    const callbackName =
      "scanCallback_" + Date.now();

    window[callbackName] =
      function(response) {

        try {

          if (!response) {

            showResult(
              "No response from the server.",
              "error"
            );

            return;
          }

          if (response.success) {

            let message = "";

            if (response.studentName) {

              message +=
                '<div class="student-name">' +
                escapeHtml(response.studentName) +
                "</div>";
            }

            if (response.action) {

              message +=
                '<div class="action">' +
                escapeHtml(response.action) +
                "</div>";
            }

            if (response.status) {

              message +=
                "<div>Status: " +
                escapeHtml(response.status) +
                "</div>";
            }

           if (response.time) {

  message +=
    "<div>Time: " +
    formatAttendanceTime(response.time) +
    "</div>";
}

            showResultHtml(
              message,
              "success"
            );

          } else {

            if (
              response.message === "Scanner login required."
            ) {
              logoutScanner();
              return;
            }

            showResult(
              response.message ||
              "Attendance was not recorded.",
              "error"
            );
          }

        } catch (error) {

          console.error(error);

          showResult(
            "An error occurred while processing the scan.",
            "error"
          );

        } finally {

          delete window[callbackName];

          const script =
            document.getElementById(callbackName);

          if (script) {
            script.remove();
          }

          // Allow another scan after a short delay.
          setTimeout(function() {

            processingScan = false;

          }, 1500);
        }
      };


    const url =
      WEB_APP_URL +
      "?action=scan" +
      "&token=" +
      encodeURIComponent(scannerToken || "") +
      "&qrID=" +
      encodeURIComponent(qrID) +
      "&activityID=" +
      encodeURIComponent(activityID) +
      "&scannerName=" +
      encodeURIComponent(scannerName) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();


    const script =
      document.createElement("script");

    script.id = callbackName;

    script.src = url;

    script.onerror = function() {

      showResult(
        "Could not connect to the attendance server.",
        "error"
      );

      delete window[callbackName];

      script.remove();

      setTimeout(function() {
        processingScan = false;
      }, 1500);
    };

    document.body.appendChild(script);
  }


  // =========================================================
  // DISPLAY RESULT
  // =========================================================

  function showResult(message, type) {

    const result =
      document.getElementById("result");

    result.className = type;

    result.textContent = message;
  }


  function showResultHtml(message, type) {

    const result =
      document.getElementById("result");

    result.className = type;

    result.innerHTML = message;
  }


  // =========================================================
  // SECURITY / DISPLAY HELPER
  // =========================================================
function formatAttendanceTime(timestamp) {

  const date = new Date(Number(timestamp));

  if (isNaN(date.getTime())) {
    return escapeHtml(timestamp);
  }

  return date.toLocaleTimeString("en-US", {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });
}
  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text == null ? "" : String(text);

    return div.innerHTML;
  }

</script>

</body>
</html>
